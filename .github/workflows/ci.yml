name: NextCore EFI CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-x86 ovmf
      - run: rustup target add x86_64-unknown-uefi
      - name: Build authored child for the picker fault probe
        run: |
          cargo build --release --target x86_64-unknown-uefi --features test-child --bin NXTEST
          echo "NEXTCORE_PICKER_CHILD=$GITHUB_WORKSPACE/target/x86_64-unknown-uefi/release/NXTEST.efi" >> "$GITHUB_ENV"
      - run: cargo check --target x86_64-unknown-uefi --all-features
      - name: Execute production picker with injected firmware failures
        run: |
          cargo build --release --target x86_64-unknown-uefi --features picker-fallback-probe --bin NXPICKER
          python3 tools/verify_picker_fallback_ovmf.py --efi-probe target/x86_64-unknown-uefi/release/NXPICKER.efi --output "$RUNNER_TEMP/picker-fallback-efi"
      - name: Preserve picker protocol-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picker-fallback-efi
          path: ${{ runner.temp }}/picker-fallback-efi
          if-no-files-found: ignore
      - run: cargo build --target x86_64-unknown-uefi --all-features --bin NXAPFS
      - run: cargo build --release --target x86_64-unknown-uefi --features arm-jit --bin NXARMJIT
      - run: cargo build --release --target x86_64-unknown-uefi --features arm-jit-probe --bin NXARMJIT
      - run: cargo build --release --target x86_64-unknown-uefi --features arm-jit-memory-provider,arm-jit-tiered-trace --bin NXARMJIT
      - name: Check authored stage-1 result rejection
        run: python3 -m unittest discover -s tools -p test_stage1_reader.py -v
      - name: Build and execute native stage-1 EFI consumer
        run: |
          cargo build --release --target x86_64-unknown-uefi --features arm-jit-stage1-probe --bin NXMMU
          python3 tools/verify_stage1_ovmf.py --efi-probe target/x86_64-unknown-uefi/release/NXMMU.efi --output "$RUNNER_TEMP/stage1-efi"
      - name: Execute owned guest DeviceTree consumer
        run: |
          cargo build --release --target x86_64-unknown-uefi --features arm-jit-dt-probe --bin NXDT
          python3 tools/verify_dt_ledger_ovmf.py --efi-probe target/x86_64-unknown-uefi/release/NXDT.efi --output "$RUNNER_TEMP/dt-ledger-efi"
          python3 tools/check_dt_ledger_capture.py --report "$RUNNER_TEMP/dt-ledger-efi/report.json" --output "$RUNNER_TEMP/dt-ledger-reader.json"
      - name: Execute transactional MMU activation in actual EFI
        run: |
          cargo build --release --target x86_64-unknown-uefi --features arm-jit-dynamic-probe --bin NXDYN
          python3 tools/verify_dynamic_ovmf.py --efi-probe target/x86_64-unknown-uefi/release/NXDYN.efi --output "$RUNNER_TEMP/dynamic-efi"
          python3 tools/check_dynamic_capture.py --report "$RUNNER_TEMP/dynamic-efi/report.json" --output "$RUNNER_TEMP/dynamic-reader.json"
      - name: Build the separately selected deep trace capability
        run: cargo build --release --target x86_64-unknown-uefi --features arm-jit-deep-trace --bin NXARMJIT
