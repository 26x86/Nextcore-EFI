[package]
name = "nextcore-efi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
uefi = { version = "0.40", features = ["alloc", "panic_handler"] }
nextcore-core = { git = "https://github.com/26x86/Nextcore-Core.git", rev = "1c1630fa8dc4d38198c94ae407fe4d6f2fcefdd9", default-features = false }
uefi-raw = { version = "0.16", optional = true }

[features]
test-child = []
kernel-probe = []
hal-tables = []
kc-staging = []
console-control = ["dep:uefi-raw"]
console-probe = ["console-control"]
apfs-jumpstart = ["dep:uefi-raw"]
arm-boot = []
arm-kernel-probe = ["arm-boot"]
arm-jit = []
arm-jit-probe = ["arm-jit"]
arm-jit-trace = ["arm-jit"]

[[bin]]
name = "NXARMJIT"
path = "src/arm_jit.rs"
test = false
bench = false
required-features = ["arm-jit"]

[[bin]]
name = "BOOTAA64"
path = "src/arm64.rs"
test = false
bench = false
required-features = ["arm-boot"]

[[bin]]
name = "NXKERNEL"
path = "src/kernel.rs"
test = false
bench = false

[[bin]]
name = "BOOTX64"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "NXTEST"
path = "src/test_child.rs"
test = false
bench = false
required-features = ["test-child"]

[[bin]]
name = "NXHAL"
path = "src/hal_tables.rs"
test = false
bench = false
required-features = ["hal-tables"]

[[bin]]
name = "NXKC"
path = "src/kc.rs"
test = false
bench = false
required-features = ["kc-staging"]

[[bin]]
name = "NXCONSOLE"
path = "src/console_probe.rs"
test = false
bench = false
required-features = ["console-probe"]

[[bin]]
name = "NXAPFS"
path = "src/apfs_probe.rs"
test = false
bench = false
required-features = ["apfs-jumpstart"]

[[bin]]
name = "NXFSFIX"
path = "src/apfs_fixture.rs"
test = false
bench = false
required-features = ["apfs-jumpstart", "test-child"]

[build-dependencies]
nextcore-ise = { git = "https://github.com/26x86/Nextcore-ISE.git", rev = "37a94d8af2a1014b90385d8c9f3ab8a950aaf6a0" }
