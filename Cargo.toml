[package]
name = "nextcore-efi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
uefi = { version = "0.40", features = ["alloc", "panic_handler"] }
nextcore-core = { git = "https://github.com/26x86/Nextcore-Core.git", rev = "4ae6e9aff31be93cf570b56975b711902f3fb7e7", default-features = false }
uefi-raw = { version = "0.16", optional = true }
nextcore-memory-service = { git = "https://github.com/26x86/Nextcore-ISE.git", rev = "fa5fe9e1b78cfce6b3bf0a0da82e68ece0704979", optional = true }

[features]
config-recovery-probe = ["dep:uefi-raw"]
watchdog-probe = []
watchdog-probe-armed = ["watchdog-probe"]
picker-fallback-probe = ["dep:uefi-raw"]
test-child = []
kernel-probe = []
hal-tables = []
kc-staging = []
console-control = ["dep:uefi-raw"]
console-probe = ["console-control"]
apfs-jumpstart = ["dep:uefi-raw"]
arm-boot = []
arm-kernel-probe = ["arm-boot"]
arm-jit = []
arm-jit-probe = ["arm-jit"]
arm-jit-trace = ["arm-jit"]
arm-jit-video-readback = ["arm-jit-trace"]
arm-jit-tiered-trace = ["arm-jit-trace", "arm-jit-probe"]
arm-jit-deep-trace = ["arm-jit-tiered-trace", "arm-jit-memory-provider"]
arm-jit-long-trace = ["arm-jit-deep-trace"]
arm-jit-initialization-trace = ["arm-jit-long-trace"]
arm-jit-mapped-trace = ["arm-jit-initialization-trace"]
arm-jit-memory-provider = ["arm-jit-trace", "arm-jit-probe", "dep:nextcore-memory-service"]
arm-jit-memory-observation = ["arm-jit-memory-provider"]
arm-jit-protection-observation = ["arm-jit-trace"]
arm-jit-provider-uncached = ["arm-jit-memory-provider"]
arm-jit-stage1-probe = ["arm-jit-memory-provider"]
arm-jit-dt-probe = ["arm-jit-stage1-probe"]
arm-jit-dynamic-probe = ["arm-jit-stage1-probe"]

[[bin]]
name = "NXCONFIG"
path = "src/config_recovery_probe.rs"
test = false
bench = false
required-features = ["config-recovery-probe"]

[[bin]]
name = "NXPICKER"
path = "src/picker_probe.rs"
test = false
bench = false
required-features = ["picker-fallback-probe"]

[[bin]]
name = "NXDYN"
path = "src/dynamic_probe.rs"
test = false
bench = false
required-features = ["arm-jit-dynamic-probe"]

[[bin]]
name = "NXDT"
path = "src/dt_probe.rs"
test = false
bench = false
required-features = ["arm-jit-dt-probe"]

[[bin]]
name = "NXMMU"
path = "src/mmu_probe.rs"
test = false
bench = false
required-features = ["arm-jit-stage1-probe"]

[[bin]]
name = "NXARMJIT"
path = "src/arm_jit.rs"
test = false
bench = false
required-features = ["arm-jit"]

[[bin]]
name = "BOOTAA64"
path = "src/arm64.rs"
test = false
bench = false
required-features = ["arm-boot"]

[[bin]]
name = "NXKERNEL"
path = "src/kernel.rs"
test = false
bench = false

[[bin]]
name = "BOOTX64"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "NXTEST"
path = "src/test_child.rs"
test = false
bench = false
required-features = ["test-child"]

[[bin]]
name = "NXHAL"
path = "src/hal_tables.rs"
test = false
bench = false
required-features = ["hal-tables"]

[[bin]]
name = "NXKC"
path = "src/kc.rs"
test = false
bench = false
required-features = ["kc-staging"]

[[bin]]
name = "NXCONSOLE"
path = "src/console_probe.rs"
test = false
bench = false
required-features = ["console-probe"]

[[bin]]
name = "NXAPFS"
path = "src/apfs_probe.rs"
test = false
bench = false
required-features = ["apfs-jumpstart"]

[[bin]]
name = "NXFSFIX"
path = "src/apfs_fixture.rs"
test = false
bench = false
required-features = ["apfs-jumpstart", "test-child"]

[build-dependencies]
nextcore-ise = { git = "https://github.com/26x86/Nextcore-ISE.git", rev = "fa5fe9e1b78cfce6b3bf0a0da82e68ece0704979" }

[[bin]]
name = "NXWATCHDOG"
path = "src/watchdog_probe.rs"
test = false
bench = false
required-features = ["watchdog-probe"]
